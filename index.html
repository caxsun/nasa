<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA 소행성 정보 조회</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b3d91; /* NASA Blue */
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h1 {
            color: #0b3d91;
            text-align: center;
            margin-top: 0;
        }
        .search-box {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #fc3d21; /* NASA Red */
            color: white;
            border: none;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e02f17;
        }
        .summary {
            font-size: 16px;
            margin-bottom: 15px;
            color: #555;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card.hazardous {
            border-left: 5px solid #fc3d21;
            background-color: #fff8f7;
        }
        .card h3 {
            margin-top: 0;
            font-size: 16px;
            color: #0b3d91;
            word-break: break-word;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-safe {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .badge-danger {
            background-color: #ffebee;
            color: #c62828;
        }
        .info-item {
            font-size: 13px;
            margin: 4px 0;
            color: #444;
        }
        .info-item span {
            font-weight: bold;
        }
        .link-btn {
            display: inline-block;
            margin-top: 12px;
            text-align: center;
            text-decoration: none;
            color: #0b3d91;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #0b3d91;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .link-btn:hover {
            background-color: #0b3d91;
            color: #fff;
        }
        .loading, .error {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #666;
        }
        .error {
            color: #fc3d21;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 NASA 근지구 소행성 (NEO) 조회</h1>
    
    <div class="search-box">
        <div class="form-group">
            <label for="startDate">시작일:</label>
            <input type="date" id="startDate">
        </div>
        <div class="form-group">
            <label for="endDate">종료일:</label>
            <input type="date" id="endDate">
        </div>
        <button onclick="fetchAsteroids()">소행성 검색</button>
    </div>

    <div id="summary" class="summary"></div>
    <div id="results" class="grid"></div>
</div>

<script>
    // 사용자 개인 API Key 설정
    const API_KEY = 'mF966tNZ5cUDXx99W1vypGQJcct0a2FCNkDC8B9k';

    // 기본 날짜 설정 (오늘 날짜)
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
        fetchAsteroids();
    };

    async function fetchAsteroids() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const summaryDiv = document.getElementById('summary');
        const resultsDiv = document.getElementById('results');

        if (!startDate) {
            alert('시작 날짜를 선택해주세요.');
            return;
        }

        // 초기화 및 로딩 표시
        summaryDiv.innerHTML = '';
        resultsDiv.innerHTML = '<div class="loading">NASA API에서 데이터를 불러오는 중...</div>';

        const url = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${startDate}&end_date=${endDate}&api_key=${API_KEY}`;

        try {
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`요청 실패 (상태 코드: ${response.status})`);
            }

            const data = await response.json();
            displayResults(data);

        } catch (error) {
            resultsDiv.innerHTML = `<div class="error">데이터를 가져오는 중 오류가 발생했습니다: ${error.message}</div>`;
        }
    }

    function displayResults(data) {
        const summaryDiv = document.getElementById('summary');
        const resultsDiv = document.getElementById('results');
        
        summaryDiv.innerHTML = `총 <strong>${data.element_count}</strong>개의 소행성이 발견되었습니다.`;
        resultsDiv.innerHTML = '';

        const nearEarthObjects = data.near_earth_objects;

        // 날짜별로 정렬되어 나오는 소행성 목록 순회
        Object.keys(nearEarthObjects).forEach(date => {
            nearEarthObjects[date].forEach(asteroid => {
                const isHazardous = asteroid.is_potentially_hazardous_asteroid;
                
                // 추정 지름 (m 단위)
                const minDiameter = Math.round(asteroid.estimated_diameter.meters.estimated_diameter_min);
                const maxDiameter = Math.round(asteroid.estimated_diameter.meters.estimated_diameter_max);
                
                // 가장 가까운 접근 정보
                const closeApproach = asteroid.close_approach_data[0];
                const velocityKmH = Math.round(closeApproach.relative_velocity.kilometers_per_hour).toLocaleString();
                const missDistanceKm = Math.round(closeApproach.miss_distance.kilometers).toLocaleString();

                // 카드 HTML 생성
                const cardHtml = `
                    <div class="card ${isHazardous ? 'hazardous' : ''}">
                        <div>
                            <span class="badge ${isHazardous ? 'badge-danger' : 'badge-safe'}">
                                ${isHazardous ? '⚠️ 위협적 소행성' : '✅ 안전함'}
                            </span>
                            <h3>${asteroid.name}</h3>
                            <div class="info-item"><span>접근 날짜:</span> ${closeApproach.close_approach_date_full}</div>
                            <div class="info-item"><span>추정 크기:</span> ${minDiameter}m ~ ${maxDiameter}m</div>
                            <div class="info-item"><span>상대 속도:</span> ${velocityKmH} km/h</div>
                            <div class="info-item"><span>최대 접근 거리:</span> ${missDistanceKm} km</div>
                            <div class="info-item"><span>절대 등급:</span> ${asteroid.absolute_magnitude_h} H</div>
                        </div>
                        <a href="${asteroid.nasa_jpl_url}" target="_blank" class="link-btn">JPL 상세 정보 보기 🔗</a>
                    </div>
                `;

                resultsDiv.innerHTML += cardHtml;
            });
        });
    }
</script>

</body>
</html>
